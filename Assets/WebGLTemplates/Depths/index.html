<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* The page is the window, and it never scrolls.
         Unity's stock template writes a hard 1920x1080 onto the canvas, so any display with a
         smaller CSS viewport -- which is every scaled laptop, since Windows recommends 125% at
         1080p and 150% at 1440p -- made the document larger than the window and left the player
         panning the page with middle-click to reach the rest of the interface.
         The canvas is taken out of the document's flow entirely and pinned to the viewport, so
         there is nothing to scroll at any size. */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #231F20;
      }
      #unity-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #231F20;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      // Leaving the browser's fullscreen puts the canvas's own size back in the stylesheet's
      // hands. Unity writes inline width and height onto the element when Screen.fullScreen is
      // set, and does not always take them off again on the way out; an inline size beats the
      // rule above, which is the other way this page ends up bigger than the window.
      document.addEventListener("fullscreenchange", function () {
        if (document.fullscreenElement) return;
        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "";
        canvas.style.height = "";
      });

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // The stage is drawn at the display's own pixel density. This is a 2D interface, so the
        // fill rate is cheap and the type is sharper for it; cap it here if a 4K display ever
        // proves otherwise: devicePixelRatio: Math.min(window.devicePixelRatio, 1.5),
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
